# Auto-deploys the backend to Modal on every push to main.
#
# One-time setup in this GitHub repo:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name: MODAL_TOKEN
#     Value: token from https://modal.com/settings (API Tokens -> New token)
#
# Requires the `tigertrace-models` Modal secret to exist first
# (see modal_app.py docstring).

name: Deploy backend to Modal

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install modal
      - run: modal deploy modal_app.py
        env:
          MODAL_TOKEN: ${{ secrets.MODAL_TOKEN }}
