# Render Blueprint for the TigerTrace backend.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo, or use
# these values when configuring the service manually.
#
# IMPORTANT sizing notes:
#   - plan: standard (2 GB RAM). The 355 MB Re-ID model + 101 MB detector +
#     the FastAPI stack need roughly 1 GB resident; Render free/starter
#     instances have 512 MB and will be OOM-killed during inference.
#   - disk: the SQLite gallery and uploaded captures live on a persistent
#     disk, otherwise every deploy wipes the registered-tiger database.
#   - the trained weights are NOT in git (too large for GitHub); build.sh
#     downloads them at build time from the models-v1 GitHub release
#     (override with MODEL_BASE_URL / MODEL_TOKEN for private hosting).

# ── Free-tier (512 MB) variant ────────────────────────────────────────────
# Render free/starter cannot fit the full model (355 MB / 442 MB resident).
# If you must run free, add these env vars — measured on real data:
#   REID_ONNX_FILENAME: tigertrace_ptr_v2_side_aware_int8.onnx  (94.7 MB file,
#     ~170 MB resident, equal accuracy, 1.7x faster — upload that file to the
#     private weights repo and set build.sh's REID_ONNX_FILENAME accordingly)
#   TIGERTRACE_NO_DETECTOR: 1  (skip MDV6, ~130 MB resident; single-view identify)
# Even then expect ~10-20 s per identification on 0.1 CPU, with little memory
# headroom if you keep the detector enabled. Prefer the paid plan for real use.

services:
  - type: web
    name: tigertrace-backend
    runtime: python
    rootDir: backend
    plan: standard
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    disk:
      name: tigertrace-data
      mountDir: /var/data/tigertrace
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_PATH
        value: /var/data/tigertrace/pench_ai.db
      - key: IMAGE_DIR
        value: /var/data/tigertrace/images
      - key: MODEL_BASE_URL
        value: https://github.com/1Yash-0/TigerTrace/releases/download/models-v1
      - key: MODEL_TOKEN
        sync: false
